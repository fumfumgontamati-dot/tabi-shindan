<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行の段取りシート</title>
<style>
:root{--paper:#F5FBF8;--white:#fff;--soft:#E3F3EE;--line:#C4E0D8;--navy:#0F4A40;--ink:#17332D;--sub:#44605A;--green:#008E78;--gold:#F07A1C;--gold-l:#FFE27A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-weight:500;font-size:18px;line-height:1.8;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:22px}
.who{display:inline-block;font-size:16px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:999px;padding:6px 16px}
h1{font-size:28px;line-height:1.4;color:var(--navy);margin:14px 0 8px;font-weight:900}
.lead{font-size:18px;color:var(--sub);margin:0}
.card{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:24px 20px;margin:16px 0}
.pic{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto 4px}
.type-k{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.1em;margin:0;text-align:center}
.type-n{font-size:26px;font-weight:900;color:var(--navy);line-height:1.35;margin:4px 0 14px;text-align:center}
h2{font-size:21px;font-weight:900;color:var(--navy);line-height:1.5;margin:0 0 6px}
.hint{font-size:16px;color:var(--sub);margin:0 0 12px}
p{margin:0}
.nm{font-weight:700}
.em{font-weight:700;font-size:1.2em}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--green);margin:3px 0 0}
.chk input:checked+span{color:var(--sub);text-decoration:line-through}
input[type=text],textarea{width:100%;min-width:0;font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--green);background:#fff}
.free{background:#FFF8E1;border-color:#F5D98A}
.keep{font-size:15px;color:var(--sub);text-align:center;margin:20px 0 0}
.back{font:inherit;font-size:16px;font-weight:700;color:var(--sub);background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline;display:block;margin:0 auto}
footer{text-align:center;font-size:15px;color:var(--sub);margin-top:30px}
@media print{.noprint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="who">ふみか｜暮らしを整える人</span>
    <h1>旅行の段取りシート</h1>
    <p class="lead">診断の結果に合わせた1枚です。</p>

    <p>しっかり調べて段取りよく進められるのが、<b class="nm">ものしりふくろうさん</b>のいいところ。準備はこのシートにまかせて、旅先では<b class="em">ゆっくりする時間</b>もつくりましょう。</p>

<script>
(function(){
  var K='tk_fukurou', d={};
  try{ d=JSON.parse(localStorage.getItem(K))||{}; }catch(e){}
  var els=document.querySelectorAll('[data-k]');
  function save(){
    els.forEach(function(el){ d[el.dataset.k]=el.type==='checkbox'?el.checked:el.value; });
    try{ localStorage.setItem(K,JSON.stringify(d)); }catch(e){}
  }
  els.forEach(function(el){
    var v=d[el.dataset.k];
    if(v!==undefined){ if(el.type==='checkbox') el.checked=v; else el.value=v; }
    el.addEventListener('input',save); el.addEventListener('change',save);
  });
  document.getElementById('clr').onclick=function(){
    if(!confirm('書いた内容を消しますか？')) return;
    els.forEach(function(el){ if(el.type==='checkbox') el.checked=false; else el.value=''; });
    d={}; try{ localStorage.removeItem(K); }catch(e){}
  };
})();
</script>
