<script>

   ここから下の4つの欄だけを書き換えてください。
   欄の外（この枠より下のプログラム）は触らなくて大丈夫です。
   書き方の決まり：文の前後の「"」は消さない。行の終わりの「,」も消さない。
   ===================================================================== */

/* ---------- ここを書き換える：①名前と肩書き ---------- */

  name:  "ふみか",          // あなたの名前

};

/* ---------- ここを書き換える：②質問5つと選択肢 ----------
   1問につき選択肢は2つ。type には③で決めるタイプの記号（A/B/C/D）を書く。
   その選択肢を選んだ人は、そのタイプに1点入ります。                */
var QUESTIONS = [
  { q: "ドラマの見方は？",
    a: [ { text: "毎週1話ずつ", type: "A" },
         { text: "休みに一気見", type: "B" } ] },
  { q: "旅行の前日は？",
    a: [ { text: "持ち物を確認", type: "C" },
         { text: "行けばなんとか", type: "D" } ] },
  { q: "片付けのやり方は？",
    a: [ { text: "毎日ちょっとずつ", type: "A" },
         { text: "手順を決めて", type: "C" } ] },
  { q: "友だちの相談には？",
    a: [ { text: "最後まで聞く", type: "B" },
         { text: "気分転換に誘う", type: "D" } ] },
  { q: "休みの朝は？",
    a: [ { text: "予定を決めて動く", type: "C" },
         { text: "起きてから考える", type: "D" } ] }
];

/* ---------- ここを書き換える：③タイプ名・一言・結果文 ----------
   タイプは3〜4つ。記号（A/B/C/D）は②と合わせる。
   結果文は120字前後。商品名・利回り・将来の数字は入れない。
   タイプ名で人を下に見る言葉（浪費型など）は使わない。            */
var TYPES = {
  A: { name: "ちょこちょこりす",
       one:  "近場へ気軽に出かける",
       text: "ちょこちょこりすさんは、週末の近場や日帰りなど、思い立ったら気軽に出かけるのが得意です。つまずきやすいのは、近場が続いて、ずっと行きたかった遠くの場所が後回しになりやすい所。次の一歩は、いつか行きたい場所を1つ選んで、行く季節だけ先に決めてみることです。LINEでは、一緒に行きたい所リストを送ります。友だち追加のあと、トークで「りす」と送ってください。" },
  B: { name: "じっくりぞう",
       one:  "一か所でのんびり過ごす",
       text: "じっくりぞうさんは、ひとつの場所にゆっくり滞在して、その土地の空気を味わうのが得意です。つまずきやすいのは、まとまった休みが取れない時期に、旅の予定そのものが先へ延びやすい所。次の一歩は、1泊で行ける場所を選んで、のんびりする日を先に決めてみることです。LINEでは、30分で決める旅行プランシートを送ります。友だち追加のあと、トークで「ぞう」と送ってください。" },
  C: { name: "ものしりふくろう",
       one:  "調べて段取りよく回る",
       text: "ものしりふくろうさんは、行き先をしっかり調べて、段取りよく旅を組み立てるのが得意です。つまずきやすいのは、予定を詰めこみすぎて、現地でゆっくりする時間が減りやすい所。次の一歩は、旅の予定の中に、何も決めない時間を半日だけ入れてみることです。LINEでは、旅行の段取りシートを送ります。友だち追加のあと、トークで「ふくろう」と送ってください。" },
  D: { name: "マイペースねこ",
       one:  "その日の気分で楽しむ",
       text: "マイペースねこさんは、その日の気分で行き先を決めて、旅先での偶然の出会いを楽しむのが得意です。つまずきやすいのは、決めずに出かけるぶん、行きたかったお店や景色を見逃しやすい所。次の一歩は、これだけは行きたい場所を1つだけ決めてから出かけてみることです。LINEでは、旅のお題カードを送ります。友だち追加のあと、トークで「ねこ」と送ってください。" }
};

/* ---------- ここを書き換える：④LINEへの一言とURL ----------
   url には LINE公式アカウントの友だち追加URL（lin.ee で始まる形）をそのまま貼る。
   短縮URLは使わない。LINEが使えない人は mailto:あなたのメール でも可。   */
var LINE = {
  button: "このタイプの方向けの1枚を、LINEで受け取る",
  url:    "https://lin.ee/VMpOp8d",
  note:   "登録しても、こちらから売り込みの連絡はしません。"
};

/* ===================== ここから下は触らない ===================== */
</script>
<style>
:root{--paper:#F5FBF8;--white:#fff;--soft:#E3F3EE;--line:#C4E0D8;--navy:#0F4A40;--ink:#17332D;--sub:#44605A;--green:#008E78;--gold:#F07A1C;--gold-l:#FFE27A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-weight:500;font-size:18px;line-height:1.8;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:22px}
.who{display:inline-block;font-size:16px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:999px;padding:6px 16px}
h1{font-size:28px;line-height:1.4;color:var(--navy);margin:14px 0 8px;font-weight:900}
.lead{font-size:18px;color:var(--sub);margin:0}
.card{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:24px 20px;margin:16px 0}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog span.on{background:var(--green)}
.qn{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.1em;margin:0 0 6px}
.q{font-size:22px;font-weight:700;color:var(--navy);line-height:1.5;margin:0 0 18px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:19px;font-weight:700;color:var(--navy);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0;cursor:pointer;line-height:1.5}
.opt:hover,.opt:focus-visible{border-color:var(--green);background:#fff;outline:none}
.back{font:inherit;font-size:16px;font-weight:700;color:var(--sub);background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline}
.type-k{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.1em;margin:0}
.type-n{font-size:28px;font-weight:900;color:var(--navy);line-height:1.35;margin:6px 0 4px}
.type-o{font-size:18px;font-weight:700;color:var(--sub);margin:0 0 16px}
.type-t{font-size:19px;margin:0 0 20px}
.btn{display:block;text-align:center;font-size:19px;font-weight:900;color:#fff;background:#06C755;border-radius:14px;padding:18px 16px;text-decoration:none;line-height:1.4}
.btn:hover{filter:brightness(1.05)}
.note{font-size:16px;color:var(--sub);text-align:center;margin:12px 0 0}
.dis{font-size:16px;color:var(--sub);margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.start{font:inherit;display:block;width:100%;font-size:21px;font-weight:900;color:#fff;background:var(--green);border:0;border-radius:14px;padding:18px;cursor:pointer}
footer{text-align:center;font-size:15px;color:var(--sub);margin-top:30px}
.retry{margin-top:16px;text-align:center}
.pets{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:0 0 6px}
.pets img{width:66px;height:66px;object-fit:contain;animation:hop 2.4s ease-in-out infinite}
.pets img:nth-child(2){animation-delay:.3s}
.pets img:nth-child(3){animation-delay:.6s}
.pets img:nth-child(4){animation-delay:.9s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.tease{text-align:center;font-size:19px;font-weight:900;color:var(--navy);margin:0 0 14px}
.rpic{display:block;width:170px;height:150px;object-fit:contain;margin:0 auto 6px;transform-origin:50% 90%;animation:pop .5s ease-out,sway 2.6s ease-in-out .5s infinite}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
#result{position:relative;overflow:hidden;text-align:center}
#result .type-t,#result .note,#result .dis{text-align:left}
#result .note{text-align:center}
.ribbon{display:inline-block;font-size:15px;font-weight:900;letter-spacing:.2em;color:#fff;background:var(--gold);border-radius:999px;padding:3px 18px;margin:0 0 10px}
.rpic-bg{width:190px;height:190px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;box-shadow:0 0 0 9px var(--tint,#FFF1DC),0 0 0 12px var(--tintd,#F6C27A)}
.rpic-bg .rpic{width:150px;height:140px;margin:0}
#result .type-n{font-size:32px;margin:2px 0 8px}
#result .type-o{margin:0 0 18px}
#result .type-o span{display:inline-block;font-size:17px;font-weight:900;color:var(--navy);background:var(--tint,#FFF1DC);border:2px solid var(--tintd,#F6C27A);border-radius:999px;padding:4px 16px}
.pts{text-align:left;margin:0 0 18px}
.pt{background:var(--paper);border-radius:14px;padding:12px 14px;margin:0 0 10px;opacity:0;animation:up .5s ease-out forwards}
.pt:nth-child(1){animation-delay:.35s}.pt:nth-child(2){animation-delay:.55s}.pt:nth-child(3){animation-delay:.75s}
.pt p{margin:0;font-size:17px;line-height:1.75}
.pt .pt-h{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:var(--green);margin:0 0 2px}
.pt-h svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@keyframes up{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.mix{text-align:left;border-top:1px dashed var(--line);padding:14px 0 4px;margin:0 0 16px}
.mix-h{font-size:16px;font-weight:900;color:var(--sub);margin:0 0 6px;text-align:center}
.mrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px;font-weight:700;color:var(--sub)}
.mrow img{width:30px;height:30px;object-fit:contain;flex:none;mix-blend-mode:multiply}
.mrow .mn{width:8.4em;flex:none;white-space:nowrap;font-size:14px}
.mrow .bar{flex:1;min-width:40px;height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--line);border-radius:6px;transform-origin:0 50%;animation:grow .8s ease-out .9s both}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.mrow.top{color:var(--navy)}
.mrow.top .bar i{background:var(--gold)}
.confetti{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.confetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:0;animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(540deg)}}
.gift{position:relative;background:#FFF8DC;border:2px dashed var(--gold);border-radius:16px;padding:18px 16px 16px;margin:0 0 16px;text-align:center}
.gift-h{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#fff;background:var(--gold);border-radius:999px;padding:4px 14px;margin:0 0 8px}
.gift-h svg{width:20px;height:20px}
.gift-n{font-size:19px;letter-spacing:-.02em;font-weight:900;color:var(--navy);line-height:1.45;margin:0 0 12px}
.steps{list-style:none;padding:0;margin:0 0 10px;text-align:left;display:inline-block}
.steps li{font-size:17px;font-weight:700;color:var(--ink);margin:4px 0;display:flex;align-items:center;gap:8px}
.steps .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:14px;font-weight:900;display:inline-flex;align-items:center;justify-content:center}
.kw{font:inherit;display:inline-flex;align-items:baseline;gap:4px;font-size:34px;font-weight:900;color:var(--navy);background:#fff;border:3px solid var(--gold);border-radius:16px;padding:6px 26px;margin:4px 0 0;cursor:pointer;box-shadow:0 4px 0 var(--gold);animation:pulse 1.8s ease-in-out infinite}
.kw small{font-size:16px;color:var(--sub);font-weight:700}
.kw:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.kw-tip{font-size:15px;font-weight:700;color:var(--sub);margin:10px 0 0}
.kw-tip.ok{color:var(--green)}
@media (prefers-reduced-motion:reduce){.pets img,.rpic,.kw{animation:none}.pt{animation:none;opacity:1}.confetti{display:none}.mrow .bar i{animation:none}}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>

    </div>
    <div class="mix" id="mix">
      <p class="mix-h">あなたの答えの内わけ</p>

      <p class="gift-h"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M2.5 9h19M12 9v11.5"/><path d="M12 9c-1.5-3.5-5.5-4-5.5-1.5S10 9 12 9zM12 9c1.5-3.5 5.5-4 5.5-1.5S14 9 12 9z"/></svg>このタイプの方への特典</p>

      </ol><br>
      <button class="kw" id="kwBtn" type="button"><span id="kw"></span><small>と送る</small></button>

    <div class="retry"><button class="back" id="retryBtn">もう一度やってみる</button></div>
  </section>

  <footer>このページは <span id="fName"></span> が作成しました。</footer>
</div>

  Object.keys(TYPES).forEach(function(k){ if(!PICS[k]) return; var im=document.createElement('img'); im.src=PICS[k]; im.alt=TYPES[k].name; $('pets').appendChild(im); });
  document.title=OWNER.pageTitle;
  $('who').textContent=OWNER.name+'｜'+OWNER.title;
  $('ttl').textContent=OWNER.pageTitle;
  $('fName').textContent=OWNER.name;
  var i=0,ans=[];
  function show(n){ ['intro','quiz','result'].forEach(function(k){$(k).hidden=(k!==n)}); window.scrollTo(0,0); }
  function render(){
    var Q=QUESTIONS[i];
    $('prog').innerHTML=QUESTIONS.map(function(_,k){return '<span class="'+(k<=i?'on':'')+'"></span>'}).join('');
    $('qn').textContent='質問 '+(i+1)+' / '+QUESTIONS.length;
    $('q').textContent=Q.q;
    var o=$('opts'); o.innerHTML='';
    Q.a.forEach(function(a){
      var b=document.createElement('button'); b.className='opt'; b.type='button'; b.textContent=a.text;
      b.onclick=function(){ ans[i]=a.type; if(i<QUESTIONS.length-1){i++;render();} else {finish();} };
      o.appendChild(b);
    });
    $('backBtn').hidden=(i===0);
  }
  function finish(){
    var score={}; Object.keys(TYPES).forEach(function(k){score[k]=0});
    ans.forEach(function(t){ if(score[t]!==undefined) score[t]++; });
    var best=Object.keys(TYPES).sort(function(a,b){return score[b]-score[a]})[0];
    var T=TYPES[best];
    if(PICS[best]){ $('rPic').src=PICS[best]; $('rPic').alt=T.name+'の絵'; $('rPic').hidden=false; } else { $('rPic').hidden=true; }
    $('rName').textContent=T.name; $('rOne').textContent=T.one;
    var gm=T.text.match(/LINEでは、(.+?)を送ります/), km=T.text.match(/「([^」]+)」と送ってください/);
    var TINT={A:['#FFF1DC','#F6C27A'],B:['#E6F0FA','#A9C7E8'],C:['#F3E9DD','#D2B48C'],D:['#FDE9EE','#F4B6C2']}[best]||['#FFF1DC','#F6C27A'];
    $('result').style.setProperty('--tint',TINT[0]); $('result').style.setProperty('--tintd',TINT[1]);
    var body=T.text.indexOf('LINEでは、')>=0?T.text.slice(0,T.text.indexOf('LINEでは、')):T.text;
    var K1='つまずきやすいのは、',K2='次の一歩は、', i1=body.indexOf(K1), i2=body.indexOf(K2);
    if(i1>0&&i2>i1){
      $('pGood').textContent=body.slice(0,i1); $('pTrip').textContent=body.slice(i1+K1.length,i2); $('pNext').textContent=body.slice(i2+K2.length);
      $('pts').hidden=false; $('rText').hidden=true;
    } else { $('pts').hidden=true; $('rText').hidden=false; }
    var mr=$('mixRows'); mr.innerHTML='';
    Object.keys(TYPES).forEach(function(k){
      var row=document.createElement('div'); row.className='mrow'+(k===best?' top':'');
      if(PICS[k]){ var im=document.createElement('img'); im.src=PICS[k]; im.alt=''; row.appendChild(im); }
      var nm=document.createElement('span'); nm.className='mn'; nm.textContent=TYPES[k].name; row.appendChild(nm);
      var bar=document.createElement('span'); bar.className='bar'; var fill=document.createElement('i'); bar.appendChild(fill); row.appendChild(bar);
      mr.appendChild(row);
      fill.style.width=Math.round(score[k]/Math.max(1,ans.length)*100)+'%';
    });
    var cf=$('confetti'); cf.innerHTML='';
    var CC=['#F07A1C','#FFE27A','#008E78','#F4B6C2','#A9C7E8'];
    for(var c=0;c<22;c++){ var p=document.createElement('i'); p.style.left=(Math.random()*96+2)+'%'; p.style.background=CC[c%CC.length]; p.style.animationDelay=(Math.random()*.6)+'s'; p.style.transform='rotate('+(Math.random()*180)+'deg)'; cf.appendChild(p); }
    if(gm&&km){
      $('rText').textContent=body;
      $('gName').textContent=gm[1]; $('gName').parentNode.style.fontSize=gm[1].length>11?'16px':''; $('kw').textContent=km[1]; $('gift').hidden=false;
      $('kwTip').textContent='タップすると言葉をコピーできます'; $('kwTip').className='kw-tip';
    } else { $('rText').textContent=T.text; $('gift').hidden=true; }
    $('rBtn').textContent=LINE.button; $('rBtn').href=LINE.url; $('rNote').textContent=LINE.note;
    show('result');
  }
  $('startBtn').onclick=function(){i=0;ans=[];render();show('quiz')};
  $('backBtn').onclick=function(){ if(i>0){i--;render();} };
  $('retryBtn').onclick=function(){show('intro')};
  $('kwBtn').onclick=function(){
    var w=$('kw').textContent, tip=$('kwTip');
    function ok(){ tip.textContent='コピーしました。LINEのトークに貼って送ってください'; tip.className='kw-tip ok'; }
    function fb(){ try{ var t=document.createElement('textarea'); t.value=w; t.setAttribute('readonly',''); t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); ok(); }catch(e){} }
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(w).then(ok,fb); } else { fb(); } }catch(e){ fb(); }
  };
})();
